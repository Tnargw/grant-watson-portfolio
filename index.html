<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Grant Watson — Software Engineer</title>

      name="description"
      content="Grant Watson, software engineer. I build full-stack web apps and the APIs behind them. React and TypeScript on the front, Node and Postgres underneath, deployed through CI to Cloudflare and Supabase. Open to software engineering roles."
    />
    <meta name="author" content="Grant Watson" />
    <link rel="canonical" href="https://grant-watson-portfolio.pages.dev/" />

    <!-- Painted before first paint so a dark-mode viewer never sees a white
         flash, and so the stored preference beats the OS on the very first
         frame rather than after hydration. -->
    <script>
      (function () {
        // If something already stamped a theme, that wins — don't fight it.
        if (document.documentElement.hasAttribute('data-theme')) return;
        try {
          var stored = localStorage.getItem('gw-portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grant Watson — Software Engineer" />
    <meta
      property="og:description"
      content="I build full-stack web apps and the APIs behind them. I led a thirty-person team through a real client build and shipped features into a platform that is live today. Open to software engineering roles."
