<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>About — Grant Watson</title>
    <meta name="description" content="What I work with, how I work on a team, and my experience and education. Grant Watson, software engineer, B.S. Computer Science." />
    <meta name="author" content="Grant Watson" />
    <link rel="canonical" href="https://grant-watson-portfolio.pages.dev/about/" />

    <!-- Applied before first paint so the page never flashes the wrong theme. -->
    <script>
      (function () {
        if (document.documentElement.hasAttribute('data-theme')) return;
        try {
          var stored = localStorage.getItem('gw-portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="About — Grant Watson" />
    <meta property="og:description" content="What I work with, how I work on a team, and my experience and education. Grant Watson, software engineer, B.S. Computer Science." />
    <meta property="og:url" content="https://grant-watson-portfolio.pages.dev/about/" />
    <meta property="og:image" content="https://grant-watson-portfolio.pages.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/about.tsx"></script>
  </body>
</html>
